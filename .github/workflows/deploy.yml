name: Deploy FE (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fe-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      S3_BUCKET: www.jireumshin.shop
      CLOUDFRONT_DISTRIBUTION_ID: EEPK5AELG3B6Q
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build (static export)
        run: yarn build

      # 정적 액세스 키는 CLI가 env에서 바로 읽음 → STS 검증(configure-aws-credentials) 불필요.
      # 키는 배포 단계에만 주입해 빌드(서드파티 의존성)에는 노출하지 않는다.
      - name: Sync to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: aws s3 sync out/ "s3://${S3_BUCKET}/" --delete

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
